name: NSE Live Day-Trading & ML Scanner

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python live_agent_daemon.py --once --output-json live_agent_feed.json
      - run: |
          git config user.name "Hybrid AI Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add live_agent_feed.json
          if ! git diff --staged --quiet; then
            git commit -m "Update live_agent_feed.json"
            git push
          fi
